<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hummus list view</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C9531C}a:hover{color:#9E3E12}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; background: #F7F0E3; color: #2A2118; font-family: Rubik, system-ui, sans-serif; display: flex; flex-direction: column">

<div style="padding: 20px 16px 12px; display: flex; align-items: center; gap: 10px">
<button aria-label="Menu" style="width: 44px; height: 44px; border: none; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; color: #2A2118">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
</button>
<label style="flex: 1; height: 44px; border-radius: 22px; background: #FFFBF4; border: 1.5px solid #E3D3B8; display: flex; align-items: center; gap: 8px; padding: 0 14px; box-sizing: border-box">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B5D4C" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<span class="sr">Search places</span>
<input type="search" placeholder="Search hummus places" style="border: none; background: transparent; font: inherit; font-size: 15px; color: #2A2118; outline: none; width: 100%">
</label>
<button aria-label="Show map" style="width: 44px; height: 44px; border: none; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; color: #2A2118">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"></path><path d="M9 4v14M15 6v14"></path></svg>
</button>
</div>

<div style="display: flex; gap: 8px; padding: 0 16px 16px; overflow: hidden; white-space: nowrap">
<button style="height: 40px; padding: 0 16px; border-radius: 20px; border: none; background: {{accent}}; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 500; display: flex; align-items: center; gap: 6px; flex-shrink: 0">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3 4h18l-7 8v7l-4 2v-9z"></path></svg>Filters (1)</button>
<button aria-label="Saved places" style="height: 40px; width: 52px; border-radius: 20px; border: 1.5px solid #D9C7A8; background: transparent; color: #2A2118; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>
</button>
<button style="height: 40px; padding: 0 16px; border-radius: 20px; border: none; background: {{accent}}; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 500; flex-shrink: 0">Ful</button>
<button style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1.5px solid #D9C7A8; background: transparent; color: #2A2118; font: inherit; font-size: 15px; flex-shrink: 0">Open now</button>
<button style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1.5px solid #D9C7A8; background: transparent; color: #2A2118; font: inherit; font-size: 15px; flex-shrink: 0">Vegan</button>
</div>

<div style="display: flex; flex-direction: column; gap: 18px; padding: 0 16px">

<a href="Place.dc.html" style="display: block; text-decoration: none; color: inherit; background: #FFFBF4; border-radius: 20px; overflow: hidden; box-shadow: 0 1px 0 #E3D3B8">
<div style="position: relative; height: 190px; background: #EAD5B4; display: flex; align-items: center; justify-content: center; color: #A9895D">
<svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M3 11h18a9 9 0 0 1-18 0z"></path><path d="M8 14.5c2 1.2 6 1.2 8 0"></path><circle cx="10" cy="7" r="1.2"></circle><circle cx="13.5" cy="6.5" r="1.2"></circle><circle cx="12" cy="8.8" r="1.2"></circle></svg>
<span style="position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: #7A5F3B">[Your photo of Shlomo &amp; Doron]</span>
<span style="position: absolute; top: 12px; right: 12px; background: #5F564B; color: #FFFFFF; font-size: 13px; font-weight: 500; padding: 5px 12px; border-radius: 14px">Closed</span>
</div>
<div style="padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
<div style="font-size: 22px; font-weight: 800; line-height: 1.15">Shlomo &amp; Doron</div>
<div style="display: flex; align-items: center; gap: 4px; font-size: 16px; font-weight: 700; flex-shrink: 0; padding-top: 3px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="{{accent}}"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.9L12 17.8 5.8 21l1.2-6.9-5-4.9 6.9-1z"></path></svg>[Your score]</div>
</div>
<div style="font-size: 14px; color: #6B5D4C">Tel Aviv, Yishkon St 29</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px">
<span style="font-size: 13px; padding: 5px 10px; border-radius: 12px; background: #F7DCC8; color: #7A3410; font-weight: 500">Hummus</span>
<span style="font-size: 13px; padding: 5px 10px; border-radius: 12px; background: #F7DCC8; color: #7A3410; font-weight: 500">Ful</span>
<span style="font-size: 13px; padding: 5px 10px; border-radius: 12px; background: #F7DCC8; color: #7A3410; font-weight: 500">Mushrooms</span>
</div>
<div style="display: flex; gap: 6px">
<span style="font-size: 12px; padding: 4px 9px; border-radius: 10px; border: 1.2px dashed #8A7A64; color: #6B5D4C; font-weight: 500">[Diet badges from OSM]</span>
</div>
</div>
</a>

<div style="background: #FFFBF4; border-radius: 20px; overflow: hidden; box-shadow: 0 1px 0 #E3D3B8">
<div style="height: 190px; background: #E2C9A3; display: flex; align-items: center; justify-content: center; color: #7A5F3B; font-size: 14px">[Next place in the list]</div>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C9531C","options":["#C9531C","#D9622B","#B8461A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#C9531C' };
}
}
</script>
</body>
</html>
